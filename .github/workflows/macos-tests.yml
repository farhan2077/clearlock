# Runs the Mac app's unit tests on every push that changes the app, its tests or how they're built.
# Pushes that only touch docs, repo housekeeping (README.md, CLAUDE.md, .gitignore, the
# release and signing scripts, …), the Windows app or the website don't affect it, so they don't run it.
name: macOS tests

on:
  push:
    paths:
      - "macos/Clearlock/**"
      - "macos/ClearlockTests/**"
      - "macos/Clearlock.xcodeproj/**"
      - "macos/Config/**"
      - "macos/scripts/test.sh"
      - ".github/workflows/macos-tests.yml"
  workflow_dispatch:

# A newer push to the same branch replaces a run that's still going.
concurrency:
  group: macos-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Clearlock needs the macOS 26 SDK or later, which the runner's default Xcode has.
      - name: Show Xcode version
        run: xcodebuild -version

      # Tests build with the project's ad-hoc signing; the self-signed release certificate
      # is never needed (or present) here.
      - name: Run tests
        run: macos/scripts/test.sh
        env:
          # test.sh writes its log here and keeps it only when the run fails.
          CLEARLOCK_TEST_LOG: ${{ runner.temp }}/clearlock-tests.log

      - name: Keep the log of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: ${{ runner.temp }}/clearlock-tests.log
          if-no-files-found: ignore
